<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel 数据合并 — 纸盒人</title>
  <meta name="description" content="纸盒人的网站 - Excel 数据复制工具">
  <link rel="icon" href="./博客.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.1/dexie.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    .excel-card { padding: 32px; }
    .excel-card h1 { font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 28px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

    .file-drop {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-glass);
      border: 1px dashed var(--border-glass);
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
    }
    .file-drop:hover { border-color: var(--primary); background: rgba(0,212,255,0.05); }
    .file-drop input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .file-drop .fd-icon { font-size: 1.3rem; color: var(--primary); }
    .file-drop .fd-label { flex: 1; font-size: 0.88rem; color: var(--text-muted); }
    .file-drop .fd-name { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); }

    .mapping-section { margin-bottom: 16px; }
    .mapping-row {
      display: flex; gap: 8px; align-items: center;
      padding: 12px; border-radius: var(--radius-sm);
      background: var(--bg-glass); border: 1px solid var(--border-subtle);
      margin-bottom: 8px;
    }
    .mapping-row input {
      background: var(--bg-glass-strong);
      padding: 8px 12px;
      font-size: 0.85rem;
    }
    .mapping-row .arrow { color: var(--text-muted); font-size: 0.9rem; }
    .mapping-row .del-map {
      background: rgba(239,68,68,0.1); border: none; color: #ef4444;
      padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.8rem; transition: background var(--transition-fast);
      white-space: nowrap;
    }
    .mapping-row .del-map:hover { background: rgba(239,68,68,0.2); }

    .btn-secondary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 20px; border-radius: var(--radius-full);
      background: rgba(34,211,238,0.1); color: var(--accent);
      border: 1px solid rgba(34,211,238,0.2);
      font-family: inherit; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all var(--transition-base);
      width: 100%;
    }
    .btn-secondary:hover { background: rgba(34,211,238,0.18); border-color: var(--accent); }

    /* 弹窗（暗色适配） */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 300;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg); padding: 28px; max-width: 420px; width: 90%;
      backdrop-filter: blur(20px); box-shadow: var(--shadow-card);
    }
    .modal-box h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 12px; }
    .modal-box .msg { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 20px; white-space: pre-line; }
    .modal-box .modal-btn {
      width: 100%; padding: 10px; border-radius: var(--radius-md);
      border: none; color: #fff; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; transition: opacity var(--transition-fast);
    }

    .loading-spinner {
      display: inline-block; width: 32px; height: 32px;
      border: 3px solid var(--border-subtle); border-top-color: var(--primary);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-box { text-align: center; padding: 16px 0; }
    .loading-box p { margin-top: 10px; color: var(--text-secondary); font-size: 0.9rem; }

    @media (max-width: 640px) {
      .excel-card { padding: 20px; }
      .mapping-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="bg-particles" aria-hidden="true"></div>

  <header class="glass-nav" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">纸盒人</a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="index.html#contact">联系</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <div class="mobile-menu-overlay" id="mobileOverlay">
    <div class="mobile-menu-panel" id="mobilePanel">
      <button class="mobile-menu-close" id="mobileClose" aria-label="关闭菜单"><i class="fas fa-times"></i></button>
      <nav class="mobile-menu-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="index.html#contact">联系</a>
      </nav>
    </div>
  </div>

  <main class="tool-page">
    <div class="tool-container">
      <div class="tool-header fade-in-up">
        <h1><span class="gradient-text">Excel 数据合并</span></h1>
        <p>将源文件数据按列映射合并到目标文件</p>
      </div>

      <div class="glass-card excel-card fade-in-up delay-100">
        <div class="form-group">
          <label>源 Excel 文件</label>
          <div class="file-drop" id="sourceDrop">
            <input type="file" accept=".xlsx,.xls" onchange="updateFileLabel(this, 'sourceLabel', 'sourceDrop')">
            <i class="fas fa-file-import fd-icon"></i>
            <span class="fd-label" id="sourceLabel">点击选择源文件</span>
          </div>
        </div>
        <div class="form-group">
          <label>目标 Excel 文件</label>
          <div class="file-drop" id="targetDrop">
            <input type="file" accept=".xlsx,.xls" onchange="updateFileLabel(this, 'targetLabel', 'targetDrop')">
            <i class="fas fa-file-export fd-icon"></i>
            <span class="fd-label" id="targetLabel">点击选择目标文件</span>
          </div>
        </div>

        <div class="form-group">
          <label>列映射设置</label>
          <div class="mapping-section" id="columnMappings">
            <div class="mapping-row">
              <input type="text" placeholder="源列 (A)" class="source-col" style="flex:1;">
              <span class="arrow"><i class="fas fa-arrow-right"></i></span>
              <input type="text" placeholder="目标列 (B)" class="target-col" style="flex:1;">
              <button class="del-map" onclick="removeMapping(this)">删除</button>
            </div>
          </div>
          <button onclick="addNewMapping()" class="btn-secondary" style="margin-bottom:12px;">
            <i class="fas fa-plus"></i> 添加列映射
          </button>
          <button onclick="generateExcel()" class="btn btn-primary btn-block">
            <i class="fas fa-play"></i> 生成新 Excel 文件
          </button>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="cyear"></span> <span class="footer-heart">♦</span> 纸盒人. Built with <span class="footer-heart">❤</span> and ☕</p>
  </footer>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 id="modalTitle"></h3>
      <div class="msg" id="modalMessage"></div>
      <button class="modal-btn" id="modalBtn" style="background:var(--gradient-primary);">确定</button>
    </div>
  </div>

  <!-- 加载弹窗 -->
  <div class="modal-overlay" id="loadingOverlay">
    <div class="modal-box" style="text-align:center;">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <p id="loadingText">正在处理...</p>
      </div>
    </div>
  </div>

  <script>
    // === 导航 + 菜单 + 动画（与首页相同） ===
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });

    const navToggle = document.getElementById('navToggle');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobilePanel = document.getElementById('mobilePanel');
    const mobileClose = document.getElementById('mobileClose');
    navToggle.addEventListener('click', () => { mobileOverlay.classList.add('open'); mobilePanel.classList.add('open'); document.body.style.overflow = 'hidden'; });
    mobileClose.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; });
    mobileOverlay.addEventListener('click', (e) => { if (e.target === mobileOverlay) { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; } });
    mobilePanel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; }));

    document.querySelectorAll('.fade-in-up').forEach(el => {
      new IntersectionObserver(([entry], obs) => {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
      }, { threshold: 0.1 }).observe(el);
    });

    // === Excel 逻辑（保持不变） ===
    function updateFileLabel(input, labelId, dropId) {
      const label = document.getElementById(labelId);
      const drop = document.getElementById(dropId);
      if (input.files[0]) {
        label.textContent = input.files[0].name;
        drop.style.borderColor = 'rgba(0,212,255,0.3)';
      } else {
        label.textContent = '点击选择文件';
        drop.style.borderColor = '';
      }
    }

    function readExcelFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            if (!workbook.SheetNames.length) throw new Error('Excel 文件中没有工作表');
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            if (!firstSheet || !Object.keys(firstSheet).length) throw new Error('工作表是空的');
            const range = XLSX.utils.decode_range(firstSheet['!ref'] || 'A1');
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, { raw: true, defval: null, header: 'A' });
            if (!jsonData.length) {
              const data = [];
              for (let R = range.s.r; R <= range.e.r; ++R) {
                const row = {};
                for (let C = range.s.c; C <= range.e.c; ++C) {
                  const cell = firstSheet[XLSX.utils.encode_cell({ c: C, r: R })];
                  row[XLSX.utils.encode_col(C)] = cell ? cell.v : '';
                }
                data.push(row);
              }
              resolve(data); return;
            }
            resolve(jsonData);
          } catch (error) { reject(new Error('读取失败: ' + error.message)); }
        };
        reader.onerror = () => reject(new Error('文件读取失败'));
        reader.readAsArrayBuffer(file);
      });
    }

    function addNewMapping() {
      const container = document.getElementById('columnMappings');
      const row = document.createElement('div');
      row.className = 'mapping-row';
      row.innerHTML = `<input type="text" placeholder="源列 (A)" class="source-col" style="flex:1;">
        <span class="arrow"><i class="fas fa-arrow-right"></i></span>
        <input type="text" placeholder="目标列 (B)" class="target-col" style="flex:1;">
        <button class="del-map" onclick="removeMapping(this)">删除</button>`;
      container.appendChild(row);
    }

    function removeMapping(btn) {
      const rows = document.querySelectorAll('.mapping-row');
      if (rows.length > 1) btn.closest('.mapping-row').remove();
      else showModal('提示', '至少保留一个列映射', false);
    }

    function getColumnMappings() {
      const mappings = [];
      document.querySelectorAll('.mapping-row').forEach(row => {
        const src = row.querySelector('.source-col').value.trim().toUpperCase();
        const tgt = row.querySelector('.target-col').value.trim().toUpperCase();
        if (src && tgt && /^[A-Z]+$/.test(src) && /^[A-Z]+$/.test(tgt)) mappings.push({ source: src, target: tgt });
      });
      return mappings;
    }

    function mergeExcelData(sourceData, targetData, columnMappings) {
      const result = [...targetData];
      sourceData.forEach(sourceRow => {
        const newRow = {};
        columnMappings.forEach(m => { if (sourceRow[m.source] !== undefined) newRow[m.target] = sourceRow[m.source]; });
        result.push(newRow);
      });
      return result;
    }

    function showModal(title, message, isError = true) {
      const overlay = document.getElementById('modalOverlay');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalMessage').textContent = message;
      const btn = document.getElementById('modalBtn');
      btn.style.background = isError ? 'linear-gradient(135deg,#ef4444,#dc2626)' : 'var(--gradient-primary)';
      overlay.classList.add('show');
      btn.onclick = () => overlay.classList.remove('show');
      overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('show'); };
    }

    function showLoading(msg) {
      document.getElementById('loadingText').textContent = msg;
      document.getElementById('loadingOverlay').classList.add('show');
    }

    function hideLoading() { document.getElementById('loadingOverlay').classList.remove('show'); }

    async function generateExcel() {
      try {
        const sourceFile = document.getElementById('sourceFile')?.files?.[0] || document.querySelector('#sourceDrop input[type="file"]').files[0];
        const targetFile = document.querySelector('#targetDrop input[type="file"]').files[0];
        const mappings = getColumnMappings();
        if (!sourceFile) { showModal('提示', '请选择源 Excel 文件', false); return; }
        if (!targetFile) { showModal('提示', '请选择目标 Excel 文件', false); return; }
        if (!mappings.length) { showModal('提示', '请至少设置一个列映射', false); return; }
        showLoading('正在处理 Excel 文件...');
        const sourceData = await readExcelFile(sourceFile);
        const targetData = await readExcelFile(targetFile);
        if (!sourceData.length) { hideLoading(); showModal('错误', '源文件中没有数据', true); return; }
        const merged = mergeExcelData(sourceData, targetData, mappings);
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(merged, { skipHeader: true });
        XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
        const ts = new Date().toISOString().replace(/[:.]/g, '-');
        XLSX.writeFile(wb, `合并结果_${ts}.xlsx`);
        hideLoading();
        const mappingText = mappings.map(m => `${m.source}列 → ${m.target}列`).join('\n');
        showModal('成功', `文件生成成功！已将源数据追加到目标文件末尾\n\n列映射：\n${mappingText}`, false);
      } catch (err) {
        hideLoading();
        showModal('错误', '处理出错：' + err.message, true);
        console.error(err);
      }
    }
  </script>
  <script src="theme.js"></script>
</body>
</html>

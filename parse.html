<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编码解析器 — 纸盒人</title>
  <meta name="description" content="纸盒人的网站 - 编码解析工具">
  <link rel="icon" href="./博客.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/3.2.1/dexie.min.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    .parse-card {
      padding: 32px;
    }

    .parse-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 28px;
    }

    .parse-input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .parse-input-wrap input {
      padding-right: 40px;
    }

    .parse-input-wrap .clear-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      transition: color var(--transition-fast);
    }

    .parse-input-wrap .clear-btn:hover {
      color: var(--primary);
    }

    .result-box {
      margin-top: 20px;
      padding: 16px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
    }

    .error-box {
      margin-top: 12px;
      color: #ef4444;
      font-size: 0.9rem;
    }

    .history-section h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
    }

    .history-item .del-btn {
      background: rgba(239, 68, 68, 0.1);
      border: none;
      color: #ef4444;
      padding: 2px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.78rem;
      transition: all var(--transition-fast);
    }

    .history-item .del-btn:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    @media (max-width: 640px) {
      .parse-card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="bg-particles" aria-hidden="true"></div>

  <!-- 导航 -->
  <header class="glass-nav" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">纸盒人</a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="index.html#contact">联系</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <!-- 移动端菜单 -->
  <div class="mobile-menu-overlay" id="mobileOverlay">
    <div class="mobile-menu-panel" id="mobilePanel">
      <button class="mobile-menu-close" id="mobileClose" aria-label="关闭菜单"><i class="fas fa-times"></i></button>
      <nav class="mobile-menu-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="index.html#contact">联系</a>
      </nav>
    </div>
  </div>

  <main class="tool-page">
    <div class="tool-container">
      <div class="tool-header fade-in-up">
        <h1><span class="gradient-text">编码解析器</span></h1>
        <p>支持 MA 编码、AHM 编码和 GS1 编码解析</p>
      </div>

      <div class="glass-card parse-card fade-in-up delay-100">
        <div class="parse-input-wrap">
          <input type="text" id="codeInput" placeholder="请输入 MA 编码、AHM 编码或 GS1 编码">
          <button class="clear-btn" onclick="clearInput()"><i class="fas fa-times-circle"></i></button>
        </div>
        <button onclick="parseCode()" class="btn btn-primary btn-block">解析</button>

        <div class="history-section" style="margin-top:24px;">
          <h2><i class="fas fa-history" style="margin-right:6px;"></i>历史记录</h2>
          <div class="history-list" id="historyList"></div>
        </div>

        <div class="result-box" id="result" style="display:none;"></div>
        <div class="error-box" id="error"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="cyear"></span> <span class="footer-heart">♦</span> 纸盒人. Built with <span class="footer-heart">❤</span> and ☕</p>
  </footer>

  <script>
    // 导航 + 菜单（与首页相同逻辑）
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });

    const navToggle = document.getElementById('navToggle');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobilePanel = document.getElementById('mobilePanel');
    const mobileClose = document.getElementById('mobileClose');
    navToggle.addEventListener('click', () => { mobileOverlay.classList.add('open'); mobilePanel.classList.add('open'); document.body.style.overflow = 'hidden'; });
    mobileClose.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; });
    mobileOverlay.addEventListener('click', (e) => { if (e.target === mobileOverlay) { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; } });
    mobilePanel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; }));

    // 进入动画
    document.querySelectorAll('.fade-in-up').forEach(el => {
      new IntersectionObserver(([entry], obs) => {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
      }, { threshold: 0.1 }).observe(el);
    });

    // === 编码解析逻辑（保持不变） ===
    const db = new Dexie('CodeHistoryDB');
    db.version(1).stores({ codes: '++id, code' });

    async function saveCode(code) { await db.codes.add({ code }); loadHistory(); }

    async function loadHistory() {
      const el = document.getElementById('historyList');
      el.innerHTML = '';
      const codes = await db.codes.toArray();
      codes.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `<span>${item.code}</span><button class="del-btn" onclick="deleteCode(${item.id})">删除</button>`;
        el.appendChild(div);
      });
    }

    async function deleteCode(id) { await db.codes.delete(id); loadHistory(); }

    function clearInput() { document.getElementById('codeInput').value = ''; }

    function parseMACode(code) {
      code = code.replace(/\s/g, '');
      const result = { '国家代码': '', '行业代码': '', '注册人代码': '', '产品编码': '', '校验码': '', '产品标识': '', '生产批号': '', '生产日期': '', '失效日期': '', '序列号': '', '灭菌批号': '', '有效期': '', '医保码': '' };
      const diParts = code.split('.');
      if (diParts[0] === 'MA' && diParts.length >= 4) {
        result['国家代码'] = diParts[1]; result['行业代码'] = diParts[2]; result['注册人代码'] = diParts[3];
        result['产品编码'] = diParts[4] || ''; result['校验码'] = diParts[5] || '';
        result['产品标识'] = diParts.slice(0, 4).join('.');
      } else { return { error: '无效的 MA 编码格式（DI 部分）' }; }
      const piPart = code.split('.').slice(4).join('.');
      if (piPart) {
        piPart.split('.').forEach(part => {
          const id = part.charAt(0), val = part.slice(1);
          switch (id) {
            case 'L': result['生产批号'] = val; break;
            case 'M': result['生产日期'] = formatDate(val); break;
            case 'E': result['失效日期'] = formatDate(val); break;
            case 'S': result['序列号'] = val; break;
            case 'D': result['灭菌批号'] = val; break;
            case 'V': result['有效期'] = formatDate(val); break;
            case 'Y': result['医保码'] = val; break;
          }
        });
      }
      return result;
    }

    function parseAHMCode(code) {
      code = code.replace(/\s/g, '');
      const result = { '放心码': '', '生产批号': '', '生产日期': '', '有效日期': '', '序列号': '' };
      if (code.startsWith('MF') && code.length >= 16) { result['放心码'] = code.slice(2, 15); } else { return { error: '无效的 AHM 编码格式（DI 部分）' }; }
      const piPart = code.slice(15);
      const piRegex = /BA(\w{4,10})\*SN(\w{5,15})\*MD(\d{6})ED(\d{6})CC(\d+)/;
      const piMatch = piPart.match(piRegex);
      if (piMatch) {
        result['生产批号'] = piMatch[1]; result['序列号'] = piMatch[2];
        result['生产日期'] = formatDate(piMatch[3]); result['有效日期'] = formatDate(piMatch[4]);
      } else { return { error: '无效的 AHM 编码格式（PI 部分）' }; }
      return result;
    }

    async function parseGS1Code(code) {
      const result = {};
      if (!code.includes('(')) { code = code.replace(/(\d{2})(\d{6}|\d+)/g, '($1)$2'); }
      const aiRegex = /\((\d{2})\)(\w+)/g;
      let match;
      while ((match = aiRegex.exec(code)) !== null) {
        const [, ai, value] = match;
        switch (ai) {
          case '01': result['GTIN'] = value; break;
          case '10': result['批号'] = value; break;
          case '11': result['生产日期'] = formatDate(value); break;
          case '17': result['有效期'] = formatDate(value); break;
          case '21': result['序列号'] = value; break;
          default: result[`AI(${ai})`] = value;
        }
      }
      if (Object.keys(result).length === 0) return { error: '无效的 GS1 编码格式' };
      return result;
    }

    function formatDate(s) {
      if (s.length === 6) { return `20${s.slice(0,2)}年${s.slice(2,4)}月${s.slice(4,6)}日`; }
      if (s.length === 8) { return `${s.slice(0,4)}年${s.slice(4,6)}月${s.slice(6,8)}日`; }
      return s;
    }

    async function parseCode() {
      const input = document.getElementById('codeInput').value;
      const resultDiv = document.getElementById('result');
      const errorDiv = document.getElementById('error');
      resultDiv.style.display = 'none';
      errorDiv.textContent = '';
      if (!input) { errorDiv.textContent = '请输入编码'; return; }
      await saveCode(input);
      let parsed;
      if (input.startsWith('MA')) parsed = parseMACode(input);
      else if (input.startsWith('MF')) parsed = parseAHMCode(input);
      else parsed = await parseGS1Code(input);
      if (parsed.error) {
        errorDiv.textContent = parsed.error;
      } else {
        resultDiv.textContent = JSON.stringify(parsed, null, 2);
        resultDiv.style.display = 'block';
      }
      document.getElementById('codeInput').value = '';
    }

    window.onload = loadHistory;
  </script>
  <script src="theme.js"></script>
</body>
</html>

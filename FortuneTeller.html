<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什么 — 纸盒人</title>
  <meta name="description" content="纸盒人的网站 - 今天吃什么">
  <link rel="icon" href="./博客.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="shared.css">
  <style>
    .fortune-card { padding: 32px; text-align: center; }

    .fortune-card .food-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 28px;
      min-height: 3rem;
      transition: all var(--transition-base);
    }

    .fortune-actions {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .food-container {
      position: relative;
      width: 100%;
      height: 320px;
      overflow: hidden;
      border-radius: var(--radius-md);
      background: var(--bg-glass);
      border: 1px solid var(--border-subtle);
    }

    .food-fly {
      position: fixed;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      animation: foodFly 1.8s ease-in-out forwards;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
    }

    @keyframes foodFly {
      0%   { opacity: 0; transform: translateY(40px) scale(0.6) rotate(0deg); }
      40%  { opacity: 1; transform: translateY(0) scale(1) rotate(8deg); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.1) rotate(-8deg); }
    }

    /* 菜单弹窗 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 300;
    }
    .modal-overlay.show { display: flex; }

    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg); padding: 28px; max-width: 440px; width: 90%;
      backdrop-filter: blur(20px); box-shadow: var(--shadow-card);
      max-height: 80vh; overflow-y: auto;
    }

    .modal-box h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; text-align: center; }

    .menu-list { margin-bottom: 16px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .menu-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px; border-radius: var(--radius-sm);
      background: var(--bg-glass); border: 1px solid var(--border-subtle);
      font-size: 0.9rem; color: var(--text-secondary);
    }
    .menu-item .del-food {
      background: rgba(239,68,68,0.1); border: none; color: #ef4444;
      padding: 2px 10px; border-radius: var(--radius-sm); cursor: pointer;
      font-size: 0.78rem; transition: background var(--transition-fast);
    }
    .menu-item .del-food:hover { background: rgba(239,68,68,0.2); }

    .add-food-row {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .add-food-row input { flex: 1; }
    .add-food-row button {
      padding: 10px 20px; border-radius: var(--radius-full);
      background: var(--gradient-primary); border: none; color: #fff;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
      white-space: nowrap; transition: opacity var(--transition-fast);
    }
    .add-food-row button:hover { opacity: 0.85; }

    .modal-close-btn {
      width: 100%; padding: 10px; border-radius: var(--radius-md);
      border: 1px solid var(--border-glass); background: var(--bg-glass);
      color: var(--text-secondary); cursor: pointer; font-size: 0.9rem;
      transition: all var(--transition-fast);
    }
    .modal-close-btn:hover { background: var(--bg-glass-strong); color: var(--text-primary); }

    @media (max-width: 640px) {
      .fortune-card { padding: 20px; }
      .fortune-card .food-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="bg-particles" aria-hidden="true"></div>

  <header class="glass-nav" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">纸盒人</a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="tech-overview.html">技术揭秘</a>
        <a href="index.html#contact">联系</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <div class="mobile-menu-overlay" id="mobileOverlay">
    <div class="mobile-menu-panel" id="mobilePanel">
      <button class="mobile-menu-close" id="mobileClose" aria-label="关闭菜单"><i class="fas fa-times"></i></button>
      <nav class="mobile-menu-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="tech-overview.html">技术揭秘</a>
        <a href="index.html#contact">联系</a>
      </nav>
    </div>
  </div>

  <main class="tool-page">
    <div class="tool-container">
      <div class="tool-header fade-in-up">
        <h1><span class="gradient-text">今天吃什么</span></h1>
        <p>选择困难症救星 — 让命运决定你的下一餐</p>
      </div>

      <div class="glass-card fortune-card fade-in-up delay-100">
        <div class="food-title" id="result">今天吃啥呀？</div>
        <div class="fortune-actions">
          <button id="startButton" class="btn btn-primary"><i class="fas fa-dice"></i> <span>开始</span></button>
          <button id="menuButton" class="btn btn-ghost"><i class="fas fa-list"></i> 菜单</button>
        </div>
        <div class="food-container" id="foodContainer"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="cyear"></span> <span class="footer-heart">♦</span> 纸盒人. Built with <span class="footer-heart">❤</span> and ☕</p>
  </footer>

  <!-- 菜单弹窗 -->
  <div class="modal-overlay" id="menuOverlay">
    <div class="modal-box">
      <h2><i class="fas fa-utensils" style="color:var(--primary);margin-right:8px;"></i>菜单列表</h2>
      <div class="menu-list" id="menuList"></div>
      <div class="add-food-row">
        <input type="text" id="newFoodInput" placeholder="新增菜品">
        <button id="addFoodButton">新增</button>
      </div>
      <button class="modal-close-btn" id="closeMenuBtn">关闭</button>
    </div>
  </div>

  <script>
    // === 导航 + 菜单 + 动画 ===
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });

    const navToggle = document.getElementById('navToggle');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobilePanel = document.getElementById('mobilePanel');
    const mobileClose = document.getElementById('mobileClose');
    navToggle.addEventListener('click', () => { mobileOverlay.classList.add('open'); mobilePanel.classList.add('open'); document.body.style.overflow = 'hidden'; });
    mobileClose.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; });
    mobileOverlay.addEventListener('click', (e) => { if (e.target === mobileOverlay) { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; } });
    mobilePanel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; }));

    document.querySelectorAll('.fade-in-up').forEach(el => {
      new IntersectionObserver(([entry], obs) => {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
      }, { threshold: 0.1 }).observe(el);
    });

    // === 核心逻辑（保持原功能） ===
    const foodOptions = [
      "馄饨","烩面","热干面","刀削面","油泼面","炸酱面","炒面","重庆小面","米线","酸辣粉","土豆粉","螺蛳粉","凉皮儿",
      "麻辣烫","肉夹馍","羊肉泡馍","炒饭","盖浇饭","烤肉饭","黄焖鸡米饭","麻辣香锅","火锅","酸菜鱼","烤串","披萨",
      "烤鸭","汉堡","炸鸡","寿司","煎饼果子","南瓜粥","小龙虾","牛排","砂锅","大排档","馒头","西餐","自助餐",
      "小笼包","水果","西北风","烧烤","泡面","水饺","日本料理","涮羊肉","兰州拉面","肯德基","面包","臊子面",
      "麦当劳","沙县小吃","烤鱼","海鲜","铁板烧","韩国料理","甜点","鸭血粉丝汤"
    ];

    const STORAGE_KEY = 'zhir_box_food_options_v1';
    function saveFoodOptions() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(foodOptions)); } catch(e) {} }
    function loadFoodOptions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length > 0 ? parsed : null;
      } catch(e) { return null; }
    }

    const stored = loadFoodOptions();
    if (stored) { foodOptions.length = 0; foodOptions.push(...stored); }
    else { saveFoodOptions(); }

    const resultEl = document.getElementById('result');
    const startBtn = document.getElementById('startButton');
    const menuBtn = document.getElementById('menuButton');
    const foodContainer = document.getElementById('foodContainer');
    const menuOverlay = document.getElementById('menuOverlay');
    const menuList = document.getElementById('menuList');
    const newFoodInput = document.getElementById('newFoodInput');
    const addFoodBtn = document.getElementById('addFoodButton');
    const closeMenuBtn = document.getElementById('closeMenuBtn');

    let intervalId = null;
    let scrollIntervalId = null;

    function createFoodItem(food) {
      const el = document.createElement('div');
      el.textContent = food;
      el.className = 'food-fly';
      el.style.left = (Math.random() * 70 + 15) + '%';
      el.style.top = (Math.random() * 70 + 15) + '%';
      el.style.color = `hsl(${Math.random() * 60 + 180}, 80%, 60%)`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1800);
    }

    function updateMenuList() {
      menuList.innerHTML = '';
      foodOptions.forEach((food, i) => {
        const div = document.createElement('div');
        div.className = 'menu-item';
        div.innerHTML = `<span>${food}</span><button class="del-food" data-index="${i}">删除</button>`;
        div.querySelector('.del-food').addEventListener('click', () => {
          foodOptions.splice(i, 1);
          saveFoodOptions();
          updateMenuList();
        });
        menuList.appendChild(div);
      });
    }

    function startScrolling() {
      let idx = 0;
      scrollIntervalId = setInterval(() => {
        resultEl.textContent = `今天吃：${foodOptions[idx]}`;
        idx = (idx + 1) % foodOptions.length;
      }, 100);
    }

    function stopScrolling() {
      clearInterval(scrollIntervalId);
      scrollIntervalId = null;
      resultEl.textContent = `今天吃：${foodOptions[Math.floor(Math.random() * foodOptions.length)]}`;
    }

    startBtn.addEventListener('click', () => {
      if (!intervalId) {
        startBtn.querySelector('span').textContent = '停止';
        menuBtn.classList.add('disabled');
        menuBtn.disabled = true;
        menuBtn.style.opacity = '0.4';
        menuBtn.style.pointerEvents = 'none';

        intervalId = setInterval(() => {
          for (let i = 0; i < 5; i++) createFoodItem(foodOptions[Math.floor(Math.random() * foodOptions.length)]);
        }, 300);
        startScrolling();
      } else {
        startBtn.querySelector('span').textContent = '开始';
        menuBtn.classList.remove('disabled');
        menuBtn.disabled = false;
        menuBtn.style.opacity = '';
        menuBtn.style.pointerEvents = '';

        clearInterval(intervalId);
        intervalId = null;
        stopScrolling();
      }
    });

    menuBtn.addEventListener('click', () => {
      if (!menuBtn.disabled) {
        updateMenuList();
        menuOverlay.classList.add('show');
      }
    });

    closeMenuBtn.addEventListener('click', () => menuOverlay.classList.remove('show'));
    menuOverlay.addEventListener('click', (e) => { if (e.target === menuOverlay) menuOverlay.classList.remove('show'); });

    addFoodBtn.addEventListener('click', () => {
      const val = newFoodInput.value.trim();
      if (val && !foodOptions.includes(val)) {
        foodOptions.push(val);
        saveFoodOptions();
        updateMenuList();
        newFoodInput.value = '';
      }
    });

    newFoodInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addFoodBtn.click();
    });
  </script>
  <script src="theme.js"></script>
</body>
</html>

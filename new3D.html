<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web 3D 演示 — 纸盒人</title>
  <meta name="description" content="纸盒人的网站 - Web 3D 地球演示">
  <link rel="icon" href="./博客.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    html, body { margin: 0; padding: 0; }

    .three-section {
      padding-top: 96px;
      padding-bottom: 60px;
    }

    .canvas-wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
    }

    #canvas-container {
      width: 100%;
      height: 60vh;
      min-height: 400px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-card), var(--shadow-glow);
      position: relative;
    }

    .three-caption {
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .three-caption i {
      color: var(--primary);
    }

    @media (max-width: 768px) {
      #canvas-container {
        height: 50vh;
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-particles" aria-hidden="true"></div>

  <header class="glass-nav" id="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">纸盒人</a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="index.html#contact">联系</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="菜单"><i class="fas fa-bars"></i></button>
    </div>
  </header>

  <div class="mobile-menu-overlay" id="mobileOverlay">
    <div class="mobile-menu-panel" id="mobilePanel">
      <button class="mobile-menu-close" id="mobileClose" aria-label="关闭菜单"><i class="fas fa-times"></i></button>
      <nav class="mobile-menu-links">
        <a href="index.html">首页</a>
        <a href="index.html#tools" class="active">工具</a>
        <a href="about.html">关于</a>
        <a href="index.html#contact">联系</a>
      </nav>
    </div>
  </div>

  <main class="three-section">
    <div class="tool-header fade-in-up">
      <h1>Web 的 <span class="gradient-text">3D</span></h1>
      <p>基于 Three.js 的地球 3D 交互展示</p>
    </div>
    <div class="canvas-wrap fade-in-up delay-100">
      <div id="canvas-container"></div>
      <p class="three-caption">
        <i class="fas fa-sync-alt"></i> 地球自动旋转 · Three.js
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="cyear"></span> <span class="footer-heart">♦</span> 纸盒人. Built with <span class="footer-heart">❤</span> and ☕</p>
  </footer>

  <script>
    // === 导航 + 菜单 + 动画 ===
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => { navbar.classList.toggle('scrolled', window.scrollY > 40); }, { passive: true });

    const navToggle = document.getElementById('navToggle');
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobilePanel = document.getElementById('mobilePanel');
    const mobileClose = document.getElementById('mobileClose');
    navToggle.addEventListener('click', () => { mobileOverlay.classList.add('open'); mobilePanel.classList.add('open'); document.body.style.overflow = 'hidden'; });
    mobileClose.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; });
    mobileOverlay.addEventListener('click', (e) => { if (e.target === mobileOverlay) { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; } });
    mobilePanel.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { mobileOverlay.classList.remove('open'); mobilePanel.classList.remove('open'); document.body.style.overflow = ''; }));

    document.querySelectorAll('.fade-in-up').forEach(el => {
      new IntersectionObserver(([entry], obs) => {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); obs.unobserve(entry.target); }
      }, { threshold: 0.1 }).observe(el);
    });

    // === Three.js 地球（原功能保持不变，适配暗色背景） ===
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    function resizeCanvas() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    // 暗色背景
    renderer.setClearColor(0x0a0f1e, 1);
    document.getElementById('canvas-container').appendChild(renderer.domElement);
    resizeCanvas();

    // 灯光
    const ambient = new THREE.AmbientLight(0x404060, 0.6);
    scene.add(ambient);
    const point = new THREE.PointLight(0x88ddff, 1.2);
    point.position.set(5, 5, 5);
    scene.add(point);
    const point2 = new THREE.PointLight(0x7c3aed, 0.5);
    point2.position.set(-3, -2, 4);
    scene.add(point2);

    const loader = new THREE.TextureLoader();
    const earthTexture = loader.load('earth.jpg');
    const geo = new THREE.SphereGeometry(1, 48, 48);
    const mat = new THREE.MeshStandardMaterial({ map: earthTexture, metalness: 0.1, roughness: 0.6 });
    const earth = new THREE.Mesh(geo, mat);
    scene.add(earth);

    camera.position.z = 2.8;

    function animate() {
      requestAnimationFrame(animate);
      earth.rotation.y += 0.004;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', resizeCanvas);
  </script>
  <script src="theme.js"></script>
</body>
</html>
